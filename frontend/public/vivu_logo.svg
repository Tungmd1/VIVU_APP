<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Gradient dải màu Cyan -> Coral đặc trưng của VIVU -->
    <linearGradient id="vivuGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="35%" stop-color="#0EA5E9"/>
      <stop offset="70%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FF6B4A"/>
    </linearGradient>

    <!-- Gradient phát sáng huyền ảo -->
    <linearGradient id="vivuGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF6B4A" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="vivuGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Nền đen sâu thuần khiết -->
  <rect width="120" height="120" rx="28" fill="#0A0A0C"/>

  <g transform="translate(4, 2)" filter="url(#vivuGlow)">
    <!-- Nét trái chữ V (Thanh vát công nghệ Cyan) -->
    <path 
      d="M32 44 L41 44 L56 81 C55 83 51 86 48 86 C45 86 42 84 41 81 L32 44 Z" 
      fill="url(#vivuGradient)" 
      stroke="#00F0FF" 
      stroke-width="1.2"
      stroke-linejoin="round"
    />

    <!-- Cánh phải chữ V uốn lượn thành Ghim Định Vị Bản Đồ (Teardrop Pin) -->
    <path 
      d="M48 85 C55 77 64 65 72 56 C79 48 81 39 77 31 C73 23 62 20 53 23 C44 26 39 34 40 43 C41 49 45 57 49 66 L55 80" 
      fill="none" 
      stroke="url(#vivuGradient)" 
      stroke-width="7" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Tâm ghim rỗng (Eye of the Pin) -->
    <circle cx="60" cy="38" r="7.5" fill="#0A0A0C" stroke="url(#vivuGradient)" stroke-width="4.5"/>
  </g>
</svg>
